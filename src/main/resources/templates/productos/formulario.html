<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="container my-4" style="max-width: 600px;">

    <div class="barra-superior">
        <h2 class="m-0" th:text="${titulo}">Producto</h2>
    </div>

    <div class="tabla-contenedor p-4">
        <form th:action="@{${accion}}" th:object="${producto}" method="post">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" id="descripcion" th:field="*{descripcion}" class="form-control"
                       th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{descripcion}"></div>
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" step="0.01" id="precio" th:field="*{precio}" class="form-control"
                       th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{precio}"></div>
            </div>

            <div class="mb-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" step="1" id="stock" th:field="*{stock}" class="form-control"
                       th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{stock}"></div>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>

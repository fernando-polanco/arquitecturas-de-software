<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="container my-4">

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/productos}" method="get" class="busqueda-form">
        <div class="busqueda-contenedor">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="size" th:value="${pageSize}">
            <input
                    type="search"
                    id="buscarNombre"
                    name="nombre"
                    class="busqueda-input"
                    placeholder="Buscar producto"
                    th:value="${nombreBuscado}"
                    autocomplete="off"
            >
            <button type="submit" class="btn-buscar">
                Buscar
            </button>

            <a th:href="@{/productos(size=${pageSize})}" class="btn-limpiar">
                Limpiar
            </a>
        </div>
    </form>

    <form id="formLista" th:action="@{/productos/eliminar-seleccionados}" method="post">
        <input type="hidden" name="page" th:value="${currentPage > 0 ? currentPage : 1}">
        <input type="hidden" name="size" th:value="${pageSize}">
        <input type="hidden" name="nombre" th:if="${nombreBuscado != null}" th:value="${nombreBuscado}">

        <div class="barra-superior d-flex justify-content-between align-items-center">
            <h2 class="m-0">Administrar productos</h2>
            <div>
                <button type="submit" class="btn btn-danger" id="btnEliminarSeleccionados">
                    Eliminar seleccionados
                </button>
                <a th:href="@{/productos/nuevo}" class="btn btn-success">Agregar nuevo</a>
            </div>
        </div>

        <div class="tabla-contenedor tabla-con-paginacion">
            <table class="table table-hover align-middle m-0">
                <thead>
                <tr>
                    <th><input type="checkbox" class="form-check-input" id="seleccionarTodos"></th>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">

                    <td><input type="checkbox" class="form-check-input casilla-fila" name="ids" th:value="${p.id}"></td>
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.descripcion}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                    <td th:text="${p.stock}"></td>
                    <td class="text-end">
                        <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>

                        <button type="submit" class="btn btn-sm btn-danger btn-eliminar-uno"
                                th:formaction="@{/productos/eliminar/{id}(id=${p.id})}">
                            Eliminar
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay registros todavía</td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>

    <div class="paginacion-contenedor">
        <div class="paginacion-resumen">
            <div class="paginacion-info text-muted small">
                <span th:if="${totalElements > 0}"
                      th:text="|Mostrando ${startItem}–${endItem} de ${totalElements} producto(s) · Página ${currentPage} de ${totalPages}|">
                </span>
                <span th:if="${totalElements == 0}">
                    Mostrando 0 de 0 productos · Página 0 de 0
                </span>
            </div>

            <form id="formPageSize" th:action="@{/productos}" method="get" class="page-size-form">
                <input type="hidden" name="page" value="1">
                <input type="hidden" name="nombre" th:if="${nombreBuscado != null}" th:value="${nombreBuscado}">
                <label for="pageSize" class="form-label m-0 small text-muted">Page size:</label>
                <input type="number"
                       id="pageSize"
                       name="size"
                       class="form-control form-control-sm page-size-input"
                       th:min="${minPageSize}"
                       th:max="${maxPageSize}"
                       step="1"
                       required
                       th:value="${pageSize}">
                <button type="submit" class="btn btn-sm btn-outline-secondary">Aplicar</button>
            </form>
        </div>

        <nav aria-label="Paginación de productos">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${isFirst} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/productos(page=1, size=${pageSize}, nombre=${nombreBuscado})}"
                       th:tabindex="${isFirst} ? '-1' : null"
                       th:aria-disabled="${isFirst} ? 'true' : null"
                       aria-label="Primera página">First</a>
                </li>

                <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/productos(page=${currentPage > 1 ? currentPage - 1 : 1}, size=${pageSize}, nombre=${nombreBuscado})}"
                       th:tabindex="${!hasPrevious} ? '-1' : null"
                       th:aria-disabled="${!hasPrevious} ? 'true' : null"
                       aria-label="Página anterior">Previous</a>
                </li>

                <li class="page-item"
                    th:each="item : ${pageItems}"
                    th:classappend="${item.ellipsis} ? 'disabled' : (${item.active} ? 'active' : '')">
                    <span class="page-link" th:if="${item.ellipsis}" aria-hidden="true">&hellip;</span>
                    <a class="page-link"
                       th:if="${!item.ellipsis}"
                       th:href="@{/productos(page=${item.pageNumber}, size=${pageSize}, nombre=${nombreBuscado})}"
                       th:text="${item.pageNumber}"
                       th:aria-current="${item.active} ? 'page' : null">1</a>
                </li>

                <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/productos(page=${hasNext ? currentPage + 1 : totalPages}, size=${pageSize}, nombre=${nombreBuscado})}"
                       th:tabindex="${!hasNext} ? '-1' : null"
                       th:aria-disabled="${!hasNext} ? 'true' : null"
                       aria-label="Página siguiente">Next</a>
                </li>

                <li class="page-item" th:classappend="${isLast} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/productos(page=${totalPages > 0 ? totalPages : 1}, size=${pageSize}, nombre=${nombreBuscado})}"
                       th:tabindex="${isLast} ? '-1' : null"
                       th:aria-disabled="${isLast} ? 'true' : null"
                       aria-label="Última página">Last</a>
                </li>
            </ul>
        </nav>
    </div>

    <div id="modalConfirmacion" class="modal-overlay" aria-hidden="true">

        <div class="modal-contenido" role="dialog"
             aria-modal="true"
             aria-labelledby="modalTitulo">

            <div class="modal-icono">
                !
            </div>

            <h3 id="modalTitulo">¿Estás seguro?</h3>

            <p id="modalMensaje">
                Esta acción no se puede deshacer.
            </p>

            <div class="modal-acciones">
                <button type="button" id="btnCancelar"
                        class="btn-modal btn-cancelar">
                    Cancelar
                </button>

                <button type="button" id="btnConfirmar"
                        class="btn-modal btn-confirmar">
                    Sí, eliminar
                </button>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/productos.js}"></script>
</body>
</html>

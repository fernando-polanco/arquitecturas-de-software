<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="container my-4">

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/productos}" method="get" class="busqueda-form">
        <div class="busqueda-contenedor">
            <input
                    type="search"
                    id="buscarNombre"
                    name="nombre"
                    class="busqueda-input"
                    placeholder="Buscar producto"
                    th:value="${nombreBuscado}"
                    autocomplete="off"
            >
            <button type="submit" class="btn-buscar">
                Buscar
            </button>

            <a th:href="@{/productos}" class="btn-limpiar">
                Limpiar
            </a>
        </div>
    </form>

    <form id="formLista" th:action="@{/productos/eliminar-seleccionados}" method="post">

        <div class="barra-superior d-flex justify-content-between align-items-center">
            <h2 class="m-0">Administrar productos</h2>
            <div>
                <button type="submit" class="btn btn-danger" id="btnEliminarSeleccionados">
                    Eliminar seleccionados
                </button>
                <a th:href="@{/productos/nuevo}" class="btn btn-success">Agregar nuevo</a>
            </div>
        </div>

        <div class="tabla-contenedor">
            <table class="table table-hover align-middle m-0">
                <thead>
                <tr>
                    <th><input type="checkbox" class="form-check-input" id="seleccionarTodos"></th>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">

                    <td><input type="checkbox" class="form-check-input casilla-fila" name="ids" th:value="${p.id}"></td>
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.descripcion}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                    <td th:text="${p.stock}"></td>
                    <td class="text-end">
                        <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>

                        <button type="submit" class="btn btn-sm btn-danger btn-eliminar-uno"
                                th:formaction="@{/productos/eliminar/{id}(id=${p.id})}">
                            Eliminar
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay registros todavía</td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>
    <div id="modalConfirmacion" class="modal-overlay" aria-hidden="true">

        <div class="modal-contenido" role="dialog"
             aria-modal="true"
             aria-labelledby="modalTitulo">

            <div class="modal-icono">
                !
            </div>

            <h3 id="modalTitulo">¿Estás seguro?</h3>

            <p id="modalMensaje">
                Esta acción no se puede deshacer.
            </p>

            <div class="modal-acciones">
                <button type="button" id="btnCancelar"
                        class="btn-modal btn-cancelar">
                    Cancelar
                </button>

                <button type="button" id="btnConfirmar"
                        class="btn-modal btn-confirmar">
                    Sí, eliminar
                </button>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/productos.js}"></script>
</body>
</html>
